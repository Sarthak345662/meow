const avatarH=z=>{const u=U();return u.pic?`<img src="${esc(u.pic)}" referrerpolicy="no-referrer" alt="" style="width:${z}px;height:${z}px;border-radius:50%;object-fit:cover">`:`<span style="width:${z}px;height:${z}px;display:inline-grid;place-items:center;border-radius:50%;background:linear-gradient(120deg,var(--ac),var(--hot));font-weight:800;font-size:${z*.45}px">${esc((u.name||S.me||'?')[0].toUpperCase())}</span>`};
const plcH=n=>{const c=ls(K('plc'),{})[n];return c?`<img src="${c}" alt="" style="width:64px;height:64px;border-radius:10px;object-fit:cover">`:'<div class="art" style="width:64px;height:64px;font-size:26px">☰</div>'};
const shrink=(f,n)=>new Promise(ok=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=n;const q=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-q)/2,(im.height-q)/2,q,q,0,0,n,n);ok(c.toDataURL('image/jpeg',.85))};im.src=URL.createObjectURL(f)});
let fmode='';
$('#pf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(fmode=='pp'){U().pic=await shrink(f,200);sv('users',S.users)}else if(fmode){const c=ls(K('plc'),{});c[fmode]=await shrink(f,300);sv(K('plc'),c)}render(true)};
function gInit(){const w=$('#gwrap');if(!w)return;
 if(!S.gid||!location.protocol.startsWith('http')){w.innerHTML='<button class="btn alt" id="gfake" style="width:100%;padding:11px">G&nbsp; Sign in with Google</button>';return}
 const go=()=>{try{google.accounts.id.initialize({client_id:S.gid,callback:gCb});google.accounts.id.renderButton(w,{theme:'filled_black',size:'large',width:300,text:'continue_with'})}catch{}};
 if(window.google?.accounts)go();else{const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.onload=go;sc.onerror=()=>{w.innerHTML='<p class="a">Google sign-in needs internet</p>'};document.head.appendChild(sc)}}
function gCb(r){try{const b=r.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'),j=JSON.parse(decodeURIComponent(escape(atob(b))));const em=String(j.email||'').toLowerCase();if(!em)throw 0;if(em==ADMIN)return toast('Admin: use the email + password login');
 const u=S.users[em]||(S.users[em]={name:j.name||em.split('@')[0],h:'',created:Date.now(),prem:0});if(!u.pic&&j.picture)u.pic=j.picture;u.g=1;sv('users',S.users);login(em)}catch{toast('Google sign-in failed')}}
// ---------- events ----------
document.body.onclick=async e=>{const sw=e.target.closest('#swap');if(sw){e.preventDefault();S.mode=S.mode=='login'?'reg':'login';return authUI()}
 const b=e.target.closest('button,[data-play],[data-aupl]');if(!b)return;const d=b.dataset,id=b.id;
 if(id=='doLogin'){const em=$('#re').value.trim().toLowerCase(),pw=$('#rp2').value;const hs=await HA(pw);
   if(em==ADMIN){const ah=ls('apw',null);if(ah?hs.includes(ah):pw=='admin'){if(!S.users[ADMIN]){S.users[ADMIN]={name:'Admin',created:Date.now()};sv('users',S.users)}login(ADMIN)}else toast('Wrong admin password')}
   else if(!S.users[em])toast('No account with this email on this device. Tap “New here? Register” first.');else if(hs.includes(S.users[em].h))login(em);else toast('Wrong password')}
 else if(id=='doReg'){const em=$('#re').value.trim().toLowerCase(),pw=$('#rp2').value,nm=$('#rn').value.trim();
   if(!/^\S+@\S+\.\S+$/.test(em))return toast('Enter a valid email');if(em==ADMIN)return toast('This email is reserved');if(pw.length<4)return toast('Password: 4+ characters');if(S.users[em])return toast('Already registered — log in');
   S.users[em]={name:nm||em.split('@')[0],h:await H(pw),created:Date.now(),prem:0};if(!sv('users',S.users))toast('Storage is blocked in this browser — account will last only until you close the app');login(em)}
 else if(id=='gfake')toast(location.protocol.startsWith('http')?'Google sign-in is not set up yet. Admin: Admin → Google sign-in → paste Client ID.':'Google sign-in works only in the web version (open the website link), not in this app.')
 else if(id=='ppic'){fmode='pp';$('#pf').click()}else if(id=='pprm'){delete U().pic;sv('users',S.users);render(true)}
 else if(d.plpic){if(!prem())toast('Playlist photos are a Premium feature. Ask the admin to activate Premium.');else{fmode=d.plpic;$('#pf').click()}}
 else if(id=='agsave'){S.gid=$('#agid').value.trim();sv('gid',S.gid);toast('Saved')}
 else if(id=='guest'){const g='guest@nova.local';if(!S.users[g]){S.users[g]={name:'Guest',h:'',created:Date.now(),prem:0};sv('users',S.users)}login(g)}else if(id=='logout'){S.me=null;sv('session',null);au.pause();S.mode='login';render()}
 else if(d.v){S.view=d.v;render()}else if(d.play!==undefined)startList(lists[+d.l],+d.play);
 else if(d.aupl){toast('Loading playlist…');try{const j=await J(`${B}/playlists/${d.aupl}/tracks?app_name=NovaMusic`);const ts=(j.data||[]).map(t=>remember(trk(t)).id);ts.length?startList(ts,0):toast('Empty playlist')}catch{toast('Could not load playlist')}}
 else if(id=='retry'){S.home=null;render(true);loadHome()}else if(id=='hplay'){const t=S.home?.trend||[];t.length?startList(t.map(x=>x.id),0):toast('Still loading…')}
 else if(d.like)like(d.like);else if(d.pl)addToPl(d.pl);else if(d.dl)download(d.dl);else if(d.rm)removeTrack(d.rm);
 else if(d.plplay){const l=pls()[d.plplay];l.length&&startList(l,0)}else if(d.pldl){for(const i of pls()[d.pldl])await download(i)}
 else if(d.pldel){const p=pls(),cc=ls(K('plc'),{});delete cc[d.pldel];sv(K('plc'),cc);delete p[d.pldel];sv(K('pls'),p);render(true)}
 else if(id=='add')$('#fi').click();else if(id=='likedPlay'){const l=likes();l.length&&startList(l,0)}
 else if(id=='newpl'){const n=prompt('Playlist name'),p=pls();if(n&&!p[n]){p[n]=[];sv(K('pls'),p);render(true)}}
 else if(isAdm()&&d.pd){const[em,n]=d.pd.split('|'),u=S.users[em];u.prem=+n?Math.max(u.prem||0,Date.now())+n*DAY:0;sv('users',S.users);render(true)}
 else if(isAdm()&&d.pc){const n=+prompt('How many premium days?','30');if(n>0){const u=S.users[d.pc];u.prem=Math.max(u.prem||0,Date.now())+n*DAY;sv('users',S.users);render(true)}}
 else if(isAdm()&&d.ud){if(d.ud!=ADMIN&&confirm('Delete user '+d.ud+'?')){delete S.users[d.ud];sv('users',S.users);render(true)}}
 else if(id=='alogo')$('#lf').click();else if(id=='alogoRm'){S.logo='';sv('logo','');render(true)}
 else if(id=='alog2'){S.tag=$('#atag').value.trim();S.c1=$('#ac1').value;sv('tag',S.tag);sv('c1',S.c1);toast('Login page saved')}
 else if(id=='aname'){S.name=$('#an').value.trim()||'Nova Music';sv('name',S.name);document.title=S.name;render(true);toast('Saved')}
 else if(id=='apw'){const ah=ls('apw',null),ok=ah?(await HA($('#o').value)).includes(ah):$('#o').value=='admin',n=$('#n').value;if(!ok)toast('Current password wrong');else if(n.length<4)toast('Too short');else{sv('apw',await H(n));toast('Password changed')}}};
$('#lf').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),q=Math.min(im.width,im.height);x.drawImage(im,(im.width-q)/2,(im.height-q)/2,q,q,0,0,256,256);S.logo=c.toDataURL('image/png');sv('logo',S.logo);render(true)};im.src=URL.createObjectURL(f);e.target.value=''};
document.addEventListener('keydown',async e=>{if(e.target.id=='q'&&e.key=='Enter'){S.qs=e.target.value.trim();if(!S.qs)return;S.res='...';render(true);$('#q').focus();S.res=await searchOnline(S.qs);render(true)}
 if((e.target.id=='re'||e.target.id=='rp2')&&e.key=='Enter')$('#doLogin,#doReg').click()});
$('#fi').onchange=async e=>{for(const f of e.target.files){const id='lo'+f.name+f.size,t={id,title:f.name.replace(/\.[^.]+$/,''),artist:'This device',from:'Local'};S.lib[id]=t;await put({...t,blob:f,dl:1});S.lib[id].dl=1}e.target.value='';render(true)};
addEventListener('online',()=>{loadHome();render(true)});addEventListener('offline',()=>render(true));
(async()=>{(await all()).forEach(t=>{const{blob,...m}=t;S.lib[t.id]=m});if(S.me&&!S.users[S.me]&&S.me!=ADMIN)S.me=null;render();if(S.me)loadHome();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})})();
